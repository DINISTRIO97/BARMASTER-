<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <title>BARMASTER - Cargando Sistema | Inicializando Plataforma de Mixología</title>
    <meta name="description" content="BARMASTER - Inicializando sistema de mixología. Cargando recetas profesionales, base de datos de licores, historia del cóctel y técnicas de bartending. Tu plataforma educativa premium gratuita.">
    <!-- Favicon BM - B blanca, M dorada (Paths vectoriales nítidos) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000' rx='6'/%3E%3Cpath d='M6 8 L6 22 L13 22 Q16 22 16 19 Q16 16 14 15 Q16 14 16 11 Q16 8 13 8 Z M8 10 L12 10 Q14 10 14 12 Q14 14 12 14 L8 14 Z M8 16 L12 16 Q14 16 14 18 Q14 20 12 20 L8 20 Z' fill='%23ffffff'/%3E%3Cpath d='M18 8 L18 22 L20 22 L20 12 L22 18 L24 12 L24 22 L26 22 L26 8 L24 8 L22 14 L20 8 Z' fill='%23d4af37'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --gold: #d4af37;
            --gold2: #b8941f;
            --stroke: rgba(212, 175, 55, 0.2);
        }

        html[data-theme="light"] {
            --bg: #fcfcf6;
            --text: #1a1410;
            --gold: #d4af37;
            --gold2: #b8941f;
            --stroke: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', Georgia, serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Fluid Background Animation */
        .fluid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000000, #0a0a0a, #000000);
            z-index: -2;
        }

        html[data-theme="light"] .fluid-bg {
            background: linear-gradient(45deg, #fcfcf6, #f5f0e6, #fcfcf6);
        }

        .fluid-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1), transparent);
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-100px) translateX(50px) scale(1.2);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-50px) translateX(-100px) scale(0.8);
                opacity: 0.4;
            }
            75% {
                transform: translateY(-150px) translateX(100px) scale(1.1);
                opacity: 0.6;
            }
        }

        /* Loading Container */
        .loading-container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        /* Logo Animation */
        .logo-container {
            position: relative;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 8px;
            background: linear-gradient(135deg, var(--gold), var(--gold2), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.5);
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
                transform: scale(1);
            }
            50% {
                filter: brightness(1.2) drop-shadow(0 0 30px rgba(212, 175, 55, 0.8));
                transform: scale(1.05);
            }
        }

        /* Fluid Lines Around Logo */
        .fluid-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 2px;
            animation: fluidLine 4s ease-in-out infinite;
        }

        .fluid-line.top {
            top: -20px;
            left: -50px;
            right: -50px;
            transform-origin: center;
        }

        .fluid-line.bottom {
            bottom: -20px;
            left: -50px;
            right: -50px;
            transform-origin: center;
            animation-delay: 2s;
        }

        @keyframes fluidLine {
            0%, 100% {
                transform: scaleX(0.5) translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: scaleX(1.2) translateY(2px);
                opacity: 0.8;
            }
        }

        /* Loading Text */
        .loading-text {
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 30px;
            opacity: 0.8;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        /* Loading Bar */
        .loading-bar-container {
            width: 300px;
            height: 4px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold2), var(--gold));
            border-radius: 2px;
            animation: loadingProgress 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .loading-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes loadingProgress {
            0% {
                width: 0%;
                transform: translateX(0);
            }
            50% {
                width: 70%;
                transform: translateX(0);
            }
            100% {
                width: 100%;
                transform: translateX(0);
            }
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        /* Fluid Orbs */
        .fluid-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2), transparent);
            animation: orbFloat 15s infinite ease-in-out;
        }

        @keyframes orbFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.2;
            }
            33% {
                transform: translate(100px, -100px) scale(1.5);
                opacity: 0.4;
            }
            66% {
                transform: translate(-100px, 100px) scale(0.8);
                opacity: 0.3;
            }
        }

        /* Status dots */
        .status-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.3s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes dotPulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: 3px solid var(--gold);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.9);
            color: var(--gold);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 99999;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .theme-toggle:hover {
            background: var(--gold);
            color: var(--bg);
            transform: scale(1.1);
        }

        html[data-theme="light"] .theme-toggle {
            background: rgba(252,252,246,0.9);
            border-color: var(--gold);
            color: var(--gold);
        }

        html[data-theme="light"] .theme-toggle:hover {
            background: var(--gold);
            color: #1a1410;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
                letter-spacing: 6px;
            }
            
            .loading-bar-container {
                width: 250px;
            }
            
            .loading-text {
                font-size: 1rem;
            }
            
            .theme-toggle {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            
            .loading-bar-container {
                width: 200px;
            }
            
            .loading-text {
                font-size: 0.9rem;
            }
        }
    </style>
    
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema" style="position: fixed !important; top: 20px !important; right: 20px !important; width: 50px !important; height: 50px !important; border: 3px solid #d4af37 !important; border-radius: 50% !important; background: rgba(0, 0, 0, 0.9) !important; color: #d4af37 !important; font-size: 20px !important; cursor: pointer !important; display: flex !important; align-items: center !important; justify-content: center !important; z-index: 999999 !important; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.5) !important;">
        <span id="themeIcon">🌙</span>
    </button>
    
    <!-- Fluid Background -->
    <div class="fluid-bg"></div>
    
    <!-- Fluid Particles -->
    <div class="fluid-particle" style="width: 300px; height: 300px; top: 10%; left: 10%;"></div>
    <div class="fluid-particle" style="width: 200px; height: 200px; top: 60%; right: 15%; animation-delay: 5s;"></div>
    <div class="fluid-particle" style="width: 250px; height: 250px; bottom: 20%; left: 20%; animation-delay: 10s;"></div>
    <div class="fluid-particle" style="width: 150px; height: 150px; top: 30%; right: 30%; animation-delay: 15s;"></div>
    
    <!-- Fluid Orbs -->
    <div class="fluid-orb" style="width: 100px; height: 100px; top: 20%; left: 5%;"></div>
    <div class="fluid-orb" style="width: 80px; height: 80px; top: 70%; right: 10%; animation-delay: 5s;"></div>
    <div class="fluid-orb" style="width: 120px; height: 120px; bottom: 30%; left: 15%; animation-delay: 10s;"></div>
    <div class="fluid-orb" style="width: 60px; height: 60px; top: 40%; right: 20%; animation-delay: 7s;"></div>

    <!-- Loading Container -->
    <div class="loading-container">
        <div class="logo-container">
            <div class="fluid-line top"></div>
            <div class="logo">BARMASTER</div>
            <div class="fluid-line bottom"></div>
        </div>
        
        <div class="loading-text" id="loadingText">Preparando tu experiencia...</div>
        
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
        
        <div class="status-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Auto-redirect after loading
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 4000);

        // Add dynamic particle generation
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'fluid-particle';
            particle.style.width = Math.random() * 200 + 100 + 'px';
            particle.style.height = particle.style.width;
            particle.style.top = Math.random() * 100 + '%';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 25000);
        }

        // Create particles periodically
        setInterval(createParticle, 3000);

        // Theme Toggle Function
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const themeIcon = document.getElementById('themeIcon');
            
            html.setAttribute('data-theme', newTheme);
            
            // Update icon
            if (newTheme === 'light') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            html.setAttribute('data-theme', savedTheme);
            
            if (savedTheme === 'light') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
            
            html.setAttribute('data-theme', savedTheme);
        });

        // Dynamic loading progress
        let progress = 0;
        const progressBar = document.querySelector('.loading-bar');
        const loadingText = document.querySelector('.loading-text');
        
        const messages = [
            'Preparando tu experiencia mixológica...',
            'Cargando recetas premium...',
            'Organizando 9,000 años de historia...',
            'Ajustando los detalles dorados...',
            'Casi listo para el brillo perfecto...'
        ];

        const updateProgress = () => {
            progress += Math.random() * 20;
            if (progress > 100) progress = 100;
            
            progressBar.style.width = progress + '%';
            
            const messageIndex = Math.floor((progress / 100) * messages.length);
            if (messageIndex < messages.length) {
                loadingText.textContent = messages[messageIndex];
            }
            
            if (progress < 100) {
                setTimeout(updateProgress, 300 + Math.random() * 500);
            }
        };

        updateProgress();
    </script>
    
                                </script>
</body>
</html>
