<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <title>BARMASTER - Pantalla de Carga | Preparando tu Experiencia de Mixología</title>
    <meta name="description" content="BARMASTER - Cargando tu experiencia de mixología. Preparando recetas profesionales, técnicas de bartending y 9000 años de historia del alcohol. Plataforma premium de mixología gratuita.">
    <!-- Favicon BM - B blanca, M dorada (Paths vectoriales nítidos) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000' rx='6'/%3E%3Cpath d='M6 8 L6 22 L13 22 Q16 22 16 19 Q16 16 14 15 Q16 14 16 11 Q16 8 13 8 Z M8 10 L12 10 Q14 10 14 12 Q14 14 12 14 L8 14 Z M8 16 L12 16 Q14 16 14 18 Q14 20 12 20 L8 20 Z' fill='%23ffffff'/%3E%3Cpath d='M18 8 L18 22 L20 22 L20 12 L22 18 L24 12 L24 22 L26 22 L26 8 L24 8 L22 14 L20 8 Z' fill='%23d4af37'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "EB Garamond", Georgia, serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            margin-bottom: 40px;
            position: relative;
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            animation: fadeInScale 1s ease-out;
        }

        .logo-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 10px;
            letter-spacing: 1px;
            animation: fadeIn 1.5s ease-out;
        }

        .cocktail-animation {
            position: relative;
            width: 120px;
            height: 200px;
            margin: 0 auto 40px;
        }

        .cocktail-glass {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 120px;
            border: 2px solid #d4af37;
            border-radius: 0 0 30px 30px;
            background: linear-gradient(to bottom, 
                rgba(212, 175, 55, 0.1) 0%, 
                rgba(212, 175, 55, 0.05) 100%);
            animation: fadeIn 1s ease-out;
        }

        .cocktail-glass::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 20px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            background: linear-gradient(to top, 
                rgba(255, 100, 100, 0.3) 0%, 
                rgba(255, 150, 150, 0.2) 50%, 
                rgba(255, 200, 200, 0.1) 100%);
            border-radius: 0 0 28px 28px;
            animation: fillGlass 2s ease-in-out infinite;
        }

        .bubbles {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .bubble {
            position: absolute;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            animation: bubble 3s ease-in-out infinite;
        }

        .bubble:nth-child(1) {
            width: 4px;
            height: 4px;
            left: -10px;
            animation-delay: 0s;
        }

        .bubble:nth-child(2) {
            width: 6px;
            height: 6px;
            left: 10px;
            animation-delay: 0.5s;
        }

        .bubble:nth-child(3) {
            width: 3px;
            height: 3px;
            left: 0px;
            animation-delay: 1s;
        }

        .loading-text {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            animation: fadeIn 2s ease-out;
        }

        .loading-dots {
            display: inline-block;
            margin-left: 5px;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #d4af37;
            border-radius: 50%;
            margin: 0 2px;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.3s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.6s;
        }

        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .gold-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #d4af37;
            border-radius: 50%;
            animation: floatUp 4s ease-in-out infinite;
        }

        .gold-particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .gold-particle:nth-child(2) {
            left: 30%;
            animation-delay: 1s;
        }

        .gold-particle:nth-child(3) {
            left: 50%;
            animation-delay: 2s;
        }

        .gold-particle:nth-child(4) {
            left: 70%;
            animation-delay: 0.5s;
        }

        .gold-particle:nth-child(5) {
            left: 90%;
            animation-delay: 1.5s;
        }

        .progress-bar {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #b8860b);
            border-radius: 1px;
            animation: progressFill 3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fillGlass {
            0%, 100% {
                height: 20px;
            }
            50% {
                height: 80px;
            }
        }

        @keyframes bubble {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-30px) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes dotPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes progressFill {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            color: #d4af37;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .theme-toggle:hover {
            background: #d4af37;
            color: #000;
            transform: scale(1.1);
        }

        /* Light Theme Styles */
        html[data-theme="light"] body {
            background: linear-gradient(145deg, rgba(252,252,246,0.98), rgba(245,240,230,0.98));
            color: #1a1410;
        }

        html[data-theme="light"] .logo {
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        html[data-theme="light"] .logo-subtitle {
            color: rgba(26, 20, 16, 0.7);
        }

        html[data-theme="light"] .cocktail-glass {
            border-color: #d4af37;
            background: linear-gradient(to bottom, 
                rgba(212, 175, 55, 0.05) 0%, 
                rgba(212, 175, 55, 0.02) 100%);
        }

        html[data-theme="light"] .cocktail-glass::before {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
        }

        html[data-theme="light"] .progress-bar {
            background: rgba(26, 20, 16, 0.1);
        }

        html[data-theme="light"] .theme-toggle {
            background: rgba(252,252,246,0.9);
            border-color: #d4af37;
            color: #d4af37;
        }

        html[data-theme="light"] .theme-toggle:hover {
            background: #d4af37;
            color: #1a1410;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .cocktail-glass {
                width: 50px;
                height: 100px;
            }
            
            .cocktail-glass::before {
                width: 60px;
                height: 15px;
            }
            
            .liquid {
                width: 46px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2rem;
            }
            
            .cocktail-animation {
                width: 100px;
                height: 150px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
        <span id="themeIcon">🌙</span>
    </button>
    
    <div class="background-effects">
        <div class="gold-particle"></div>
        <div class="gold-particle"></div>
        <div class="gold-particle"></div>
        <div class="gold-particle"></div>
        <div class="gold-particle"></div>
    </div>

    <div class="loading-container">
        <div class="logo-container">
            <h1 class="logo">BARMASTER</h1>
            <p class="logo-subtitle">El Arte de la Mixología</p>
        </div>

        <div class="cocktail-animation">
            <div class="cocktail-glass">
                <div class="liquid"></div>
                <div class="bubbles">
                    <div class="bubble"></div>
                    <div class="bubble"></div>
                    <div class="bubble"></div>
                </div>
            </div>
        </div>

        <div class="loading-text">
            <span id="loadingText">Preparando tu experiencia</span>
            <span class="loading-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        // Simulación de carga
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 3000);

        // Efectos interactivos
        document.addEventListener('DOMContentLoaded', () => {
            // Añadir más partículas dinámicamente
            const backgroundEffects = document.querySelector('.background-effects');
            
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'gold-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = (3 + Math.random() * 2) + 's';
                backgroundEffects.appendChild(particle);
            }

            // Efecto de brillo en el logo
            const logo = document.querySelector('.logo');
            setInterval(() => {
                logo.style.textShadow = '0 0 40px rgba(212, 175, 55, 0.8)';
                setTimeout(() => {
                    logo.style.textShadow = '0 0 30px rgba(212, 175, 55, 0.5)';
                }, 500);
            }, 2000);
        });

        // Theme Toggle Function
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const themeIcon = document.getElementById('themeIcon');
            
            html.setAttribute('data-theme', newTheme);
            
            // Update icon
            if (newTheme === 'light') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }

        // Load saved theme on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            html.setAttribute('data-theme', savedTheme);
            
            if (savedTheme === 'light') {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        });
    </script>
    
                    }
    </script>
</body>
</html>
